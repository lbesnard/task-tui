[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "task-tui"
version = "1.3.0"
description = "A modern, interactive TUI for Taskwarrior built with Textual"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "L. Besnard" }]
license = { text = "MIT" }
keywords = ["taskwarrior", "tui", "productivity", "cli"]
dependencies = ["textual>=0.85.0"]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "black>=23.0.0",
  "ruff>=0.1.0",
  "mypy>=1.0.0",
]

[project.scripts]
task-tui = "task_tui.app:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["task_tui*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
