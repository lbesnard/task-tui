[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --cov=task_tui
    --cov-report=term-missing
    --cov-report=html
    --cov-branch

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
