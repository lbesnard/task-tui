[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --cov=task_tui
    --cov-report=term-missing
    --cov-report=html
    --cov-branch
    -m "not ui_integration"

markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may be slower)
    ui_integration: Tests requiring full Textual UI context (skipped by default)
    slow: Slow running tests
